
      - name: Create package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts" | Out-Null
          & "$env:RUNNER_TEMP/nuget.exe" pack "packaging/BusinessRuleExporter.nuspec" -BasePath "." -OutputDirectory "artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem -Path "artifacts" -Filter "*.nupkg" -Recurse | Select-Object FullName, Length
          $package = Get-ChildItem -Path "artifacts" -Filter "GagandeepSingh.BusinessRuleExporter.1.0.1.nupkg" -Recurse | Select-Object -First 1
          if (-not $package) { throw "NuGet package was not found after packing." }
          "PACKAGE_PATH=$($package.FullName)" >> $env:GITHUB_ENV

      - name: NuGet Trusted Login
        id: login
        uses: NuGet/login@v1
        with:
          user: glowofsky

      - name: Publish package
        shell: pwsh
        run: |
          dotnet nuget push "$env:PACKAGE_PATH" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json"
